name: Release

# 推送 v* 标签时触发：在原生 runner 上构建 Linux 静态二进制并发布 Release
# amd64 → ubuntu-latest；arm64 → ubuntu-24.04-arm（公共仓库免费的原生 ARM runner）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  BIN_NAME: openlist-rs

jobs:
  build:
    name: build (${{ matrix.artifact }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: openlist-rs-linux-amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: openlist-rs-linux-arm64
    steps:
      - uses: actions/checkout@v4

      # 1. 前端构建（产物 web/dist 由 rust-embed 在编译期嵌入）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build frontend
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      # 2. Rust 工具链（原生架构，无需交叉工具链）
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 3. musl 环境（musl-tools 提供 musl-gcc）
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Set linker env
        run: |
          T=${{ matrix.target }}
          U=$(echo "$T" | tr '-' '_' | tr 'a-z' 'A-Z')
          echo "CARGO_TARGET_${U}_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "CC_${U}=musl-gcc" >> "$GITHUB_ENV"
          echo "AR_${U}=ar" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      # 4. 编译（rustls TLS，无 openssl 依赖）
      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      # 5. 打包并发布
      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/$BIN_NAME" "dist/$BIN_NAME"
          tar -czf "${{ matrix.artifact }}.tar.gz" -C dist "$BIN_NAME"
          sha256sum "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.2
          files: |
            ${{ matrix.artifact }}.tar.gz
